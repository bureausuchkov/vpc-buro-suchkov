function bytes(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function b64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function open(raw){
  return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(IV)},k,bytes(DATA))})
    .then(function(p){return new TextDecoder().decode(p)});
}
// пока браузер читает эту страницу, document.open не срабатывает и текст дописался бы внутрь нее
function show(html){var go=function(){document.open();document.write(html);document.close()};if(document.readyState==='complete')go();else window.addEventListener('load',go)}
var v=document.getElementById('v'),f=document.getElementById('f'),p=document.getElementById('p'),b=document.getElementById('b'),e=document.getElementById('e');
var saved=null;try{saved=localStorage.getItem(STORE)}catch(x){}
if(saved){v.hidden=true;open(bytes(saved)).then(show,function(){try{localStorage.removeItem(STORE)}catch(x){}v.hidden=false;p.focus()})}
else p.focus();
f.addEventListener('submit',function(ev){
  ev.preventDefault();
  var c=p.value.normalize('NFC').trim();if(!c)return;
  b.disabled=true;e.textContent='Проверяем код…';
  crypto.subtle.importKey('raw',new TextEncoder().encode(c),'PBKDF2',false,['deriveBits'])
    .then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:bytes(SALT),iterations:ITER},k,256)})
    .then(function(bits){var raw=new Uint8Array(bits);return open(raw).then(function(html){try{localStorage.setItem(STORE,b64(raw))}catch(x){}show(html)})})
    .catch(function(){b.disabled=false;e.textContent='Неверный код, попробуйте ещё раз';p.value='';p.focus()});
});
})();
